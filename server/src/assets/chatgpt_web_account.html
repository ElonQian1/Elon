<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f12" />
  <title>ChatGPT 网页账号 · 一龙 AI</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/chatgpt_web_account.css" />
</head>
<body>
  <header class="account-toolbar">
    <a class="account-back" href="/?tab=profile" aria-label="返回一龙 AI">‹</a>
    <div>
      <strong>ChatGPT 网页账号</strong>
      <span>一龙 AI</span>
    </div>
  </header>

  <main class="account-main">
    <section class="login-stage" aria-labelledby="accountTitle">
      <div class="account-product">
        <img src="/favicon.ico" alt="" width="32" height="32" />
        <span>一龙 AI 网页账号</span>
      </div>
      <div class="login-copy">
        <p class="account-kicker">网页账号</p>
        <h1 id="accountTitle">ChatGPT</h1>
        <p>登录你的账号，继续使用 ChatGPT。</p>
      </div>
      <div class="login-actions">
        <a id="chatGptOfficialLogin" class="login-primary" href="https://chatgpt.com/auth/login">
          <span>登录 ChatGPT</span>
          <span class="login-arrow" aria-hidden="true">→</span>
        </a>
        <a class="login-secondary" href="https://chatgpt.com/">已经登录，直接打开聊天</a>
      </div>
      <p class="login-privacy">账号密码只在 ChatGPT 官方页面输入</p>
    </section>

    <section class="account-details" aria-label="登录说明">
      <div>
        <span>登录页面</span>
        <strong>ChatGPT 官方网页</strong>
      </div>
      <div>
        <span>会话存储</span>
        <strong>当前浏览器</strong>
      </div>
    </section>

    <section class="apk-note" aria-labelledby="apkTitle">
      <div>
        <h2 id="apkTitle">在一龙 APK 中继续</h2>
        <p>APK 使用独立的本机网页登录状态。</p>
      </div>
      <a href="/app/download">获取最新版</a>
    </section>
  </main>
</body>
</html>
