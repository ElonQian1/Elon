[package]
name = "elon-server"
version = "0.3.56"
edition = "2021"

[[bin]]
name = "elon-server"
path = "src/main.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 共享协议（homecli PC agent ↔ 本服务的反向 WSS 长连接）
homecli-proto = { path = "homecli-proto" }

# Web 框架
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# HTTP 客户端（调用 AI API）
# 使用 rustls 而非 native-tls，方便 musl 交叉编译（不依赖系统 OpenSSL）
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 环境变量
dotenvy = "0.15"

# 错误处理
anyhow = "1"
thiserror = "1"

# 异步流
futures = "0.3"
tokio-stream = "0.1"

# UUID
uuid = { version = "1", features = ["v4"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# SQLite 数据保存
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
