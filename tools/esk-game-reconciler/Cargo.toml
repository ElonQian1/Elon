[package]
name = "esk-game-reconciler"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
elon-game-rewards-harness = { path = "../../server/tests/game-rewards-harness" }
rusqlite = { version = "0.31", features = ["bundled"] }
