<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101010" />
  <title>一龙 · 云端开发</title>
  <!-- ===== iOS PWA ===== -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="一龙" />
  <link rel="apple-touch-icon" href="data:image/png;base64,__BRAND_PNG_B64__" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #101010;
      --bg-hint: #1c1c1c;
      --panel: #1e1e1e;
      --panel-2: #242424;
      --panel-3: #2a2a2a;
      --line: #343434;
      --ink: #d0d0d0;
      --ink-strong: #ededed;
      --ink-soft: #b8b8b8;
      --ink-muted: #a9a9a9;
      --ink-faint: #8e8e8e;
      --ink-dim: #505050;
      --brand: #07c160;
      --brand-hover: #06ad55;
      --bubble-user: #95ec69;
      --bubble-user-ink: #111111;
      --bubble-ai-bg: rgba(255,255,255,0.19);
      --bubble-ai-border: rgba(255,255,255,0.18);
      --bubble-ai-ink: #f4f4f4;
      --bubble-progress-bg: rgba(255,255,255,0.15);
      --bubble-progress-border: rgba(255,255,255,0.2);
      --bubble-progress-ink: #9a9a9a;
      --bubble-error-bg: #fff1f0;
      --bubble-error-border: #ffd6d2;
      --bubble-error-ink: #c62828;
      --tab-icon: #b8b8b8;
      --tab-active: #d0d0d0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hidden { display: none !important; }

    /* ===== 整体布局 ===== */
    .app {
      display: grid;
      min-height: 100vh;
      grid-template-rows: 50px 1fr auto 52px;
      grid-template-columns: 1fr;
      grid-template-areas:
        "toolbar"
        "content"
        "input"
        "tabs";
    }
    /* 平板 / 桌面：限定宽度居中，Tab 始终在底部（与 APK 一致） */
    @media (min-width: 720px) {
      .app { max-width: 720px; margin: 0 auto; box-shadow: 0 0 0 1px #1a1a1a; }
    }

    /* ===== Toolbar ===== */
    .toolbar {
      grid-area: toolbar;
      height: 50px;
      background: var(--bg);
      display: flex;
      align-items: center;
      padding: 0 4px;
    }
    .toolbar h1 {
      flex: 1;
      text-align: center;
      margin: 0;
      font-size: 17px;
      font-weight: normal;
      color: var(--ink);
    }
    .icon-btn {
      width: 44px; height: 44px;
      background: transparent;
      border: 0;
      padding: 9px;
      color: var(--ink-soft);
      cursor: pointer;
      border-radius: 22px;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.06); color: var(--ink); }
    .icon-btn svg { width: 100%; height: 100%; display: block; }

    /* ===== Content ===== */
    .content {
      grid-area: content;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      /* iOS 惯性滚动 */
      -webkit-overflow-scrolling: touch;
    }
    .page.active { display: flex; }

    /* ===== 会话页 ===== */
    .conversation-list { flex: 0 0 auto; }
    .search-bar { flex: 0 0 auto; padding: 8px 14px; background: var(--panel-2); }
    .search-bar input { width: 100%; background: var(--bg-hint,var(--panel-2)); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; color: var(--ink); font-size: 14px; outline: none; box-sizing: border-box; }
    .search-bar input::placeholder { color: var(--ink-soft); }
    .conversation-item {
      height: 66px;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      cursor: pointer;
      border: 0;
      width: 100%;
      text-align: left;
      color: inherit;
      border-bottom: 1px solid #1a1a1a;
    }
    .conversation-item:hover { background: #2c2c2c; }
    .conversation-item.active { background: #2f2f2f; }
    .conversation-item .brand {
      width: 44px; height: 44px;
      flex: 0 0 44px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--panel);
      display: flex; align-items: center; justify-content: center;
    }
    .conversation-item .brand img { width: 100%; height: 100%; object-fit: cover; }
    .conversation-item .text { flex: 1; min-width: 0; }
    .conversation-item .title {
      font-size: 16px; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conversation-item .sub {
      font-size: 13px; color: var(--ink-muted);
      margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conversation-item .time {
      font-size: 12px; color: #c4c4c4;
      align-self: flex-start; margin-top: 16px;
      flex-shrink: 0; padding-left: 6px;
    }
    .conversation-item .item-delete {
      display: none;
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: transparent;
      border: 0; cursor: pointer;
      color: #d97a7a;
      font-size: 18px;
      line-height: 30px;
      text-align: center;
    }
    .conversation-item:hover .item-delete { display: flex; align-items: center; justify-content: center; }
    .empty-tip {
      padding: 80px 24px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .empty-tip button {
      margin-top: 16px;
      height: 38px; padding: 0 18px;
      background: var(--brand); color: #fff;
      border: 0; border-radius: 6px; cursor: pointer;
    }

    /* ===== 聊天视图 ===== */
    .chat-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .stage-hint {
      flex: 0 0 auto;
      min-height: 42px;
      background: var(--bg-hint);
      color: var(--ink-soft);
      font-size: 13px;
      padding: 0 16px;
      display: flex; align-items: center;
    }
    .chat-list {
      flex: 1; overflow-y: auto;
      padding: 10px 10px;
      display: flex; flex-direction: column;
      gap: 10px;
      /* iOS 惯性滚动 */
      -webkit-overflow-scrolling: touch;
    }
    .bubble-row { display: flex; align-items: flex-end; gap: 8px; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble {
      max-width: 76%;
      padding: 10px 14px;
      font-size: 15px;
      line-height: 1.55;
      border-radius: 8px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .bubble.user {
      background: var(--bubble-user);
      color: var(--bubble-user-ink);
      border-top-right-radius: 2px;
    }
    .bubble.ai {
      background: var(--bubble-ai-bg);
      color: var(--bubble-ai-ink);
      border: 1px solid var(--bubble-ai-border);
      border-top-left-radius: 2px;
    }
    .bubble.progress {
      background: var(--bubble-progress-bg);
      color: var(--bubble-progress-ink);
      border: 1px solid var(--bubble-progress-border);
      font-size: 13px;
      max-width: 86%;
    }
    .bubble.error {
      background: var(--bubble-error-bg);
      color: var(--bubble-error-ink);
      border: 1px solid var(--bubble-error-border);
    }
    .bubble .meta { display: block; font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
    .bubble a { color: inherit; text-decoration: underline; }

    @media (min-width: 720px) {
      .bubble { max-width: 70%; }
    }

    /* ===== 项目页 ===== */
    .project-page > * + * { margin-top: 1px; }
    .project-stage {
      min-height: 64px;
      background: var(--panel-2);
      display: flex; align-items: center;
      padding: 12px 22px;
      font-size: 18px; color: var(--ink);
    }
    .project-overview {
      background: var(--panel);
      padding: 22px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
      min-height: 104px;
    }
    .project-block {
      background: var(--panel);
      padding: 18px 22px;
      margin-top: 10px !important;
    }
    .project-block h3 { margin: 0 0 4px; font-size: 16px; color: var(--ink); font-weight: normal; }
    .stage-line { padding: 8px 0; font-size: 14px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
    .stage-line.active { color: var(--brand); font-weight: 500; }
    .stage-line.done { color: #47c484; }
    .stage-line.active::after { content: '⋯'; animation: dots 1.2s infinite; }
    @keyframes dots { 0%,100%{opacity:1} 50%{opacity:.3} }
    .project-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: var(--panel);
      padding: 12px;
      margin-top: 10px !important;
    }
    .project-grid button {
      height: 54px;
      background: var(--panel-3);
      color: var(--ink);
      border: 0; border-radius: 6px;
      font-size: 15px; cursor: pointer;
    }
    .project-grid button:hover { background: #353535; }
    .project-history {
      background: var(--panel);
      padding: 22px;
      margin-top: 10px !important;
      color: var(--ink-soft);
      font-size: 13px;
      min-height: 160px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    /* ===== 我的页 ===== */
    /* 用户卡片（头像 + 昵称 + 账号，对齐 APK activity_settings.xml 顶部） */
    .profile-user-card {
      background: var(--panel-2);
      padding: 22px 22px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .profile-avatar {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a3a2a, #47c484);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      color: #fff;
      flex-shrink: 0;
      font-weight: 500;
      user-select: none;
    }
    .profile-user-info { flex: 1; min-width: 0; }
    .profile-nickname {
      font-size: 18px;
      color: var(--ink-strong);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .profile-account {
      font-size: 13px;
      color: var(--ink-faint);
      margin-top: 5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .profile-workspace-hint {
      font-size: 12px;
      color: var(--ink-dim);
      margin-top: 3px;
    }
    /* Token 消耗统计 */
    .usage-section {
      background: var(--panel);
      padding: 18px 22px;
      margin-top: 10px !important;
    }
    .usage-section h3 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: normal;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .usage-section h3 small { font-size: 12px; color: var(--ink-dim); font-weight: normal; }
    .usage-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
    }
    .usage-row:last-child { border-bottom: none; }
    .usage-label { color: var(--ink-soft); }
    .usage-value { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 14px; }
    .usage-hint { font-size: 12px; color: var(--ink-dim); margin-top: 8px; }
    .profile-row {
      min-height: 64px;
      background: var(--panel);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px;
      color: var(--ink);
      font-size: 16px;
      cursor: pointer;
      margin-top: 1px;
      border: 0; width: 100%; text-align: left;
    }
    .profile-row:first-of-type { margin-top: 10px; }
    .profile-row:hover { background: #252525; }
    .profile-row .arrow { color: var(--ink-faint); font-size: 18px; }
    .profile-row.danger { color: #d97a7a; }
    .profile-version {
      text-align: center;
      color: var(--ink-dim);
      font-size: 12px;
      padding: 20px 0 32px;
    }

    /* ===== 我的页 APK 推广块 ===== */
    .apk-promo {
      background: var(--panel-2);
      padding: 16px 22px 14px;
      margin-top: 10px;
    }
    .apk-promo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .apk-promo-icon { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
    .apk-promo-icon img { width: 100%; height: 100%; object-fit: cover; }
    .apk-promo-meta { display: flex; flex-direction: column; gap: 3px; }
    .apk-promo-name { font-size: 15px; color: var(--ink); }
    .apk-promo-ver { font-size: 12px; color: var(--ink-dim); }
    .apk-promo-actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .apk-promo-actions .download-btn { flex: 1; height: 42px; font-size: 14px; border-radius: 7px; }
    .apk-promo-actions .copy-btn { flex: 1; height: 42px; font-size: 13px; border-radius: 7px; gap: 6px; }
    .download-btn {
      background: var(--brand); color: #fff;
      border: 0; cursor: pointer; width: 100%;
    }
    .download-btn:hover { background: var(--brand-hover); }
    .copy-btn {
      background: var(--panel-3); color: var(--ink);
      border: 1px solid var(--line);
      cursor: pointer; width: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .copy-btn:hover { background: #353535; }
    .copy-btn.copied { color: var(--brand); border-color: var(--brand); }
    .download-link-box {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 7px; padding: 10px 12px;
      font-size: 12px; color: var(--ink-soft);
      word-break: break-all; line-height: 1.5;
    }

    /* ===== 输入栏 ===== */
    .input-bar {
      grid-area: input;
      background: var(--panel);
      display: none;
      padding: 8px 10px;
      /* iOS 键盘收起后底部安全区域 */
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      gap: 8px;
      align-items: flex-end;
    }
    .input-bar.active { display: flex; }
    .input-bar textarea {
      flex: 1;
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink-strong);
      padding: 8px 14px;
      font-size: 15px;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      outline: none;
      line-height: 1.4;
    }
    .input-bar textarea::placeholder { color: var(--ink-faint); }
    .input-bar .model-btn {
      width: 52px; height: 42px;
      background: var(--panel-3);
      border: 0;
      color: var(--ink);
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .input-bar .model-btn:hover { background: #353535; }
    .input-bar .send-btn {
      width: 64px; height: 42px;
      background: var(--brand);
      border: 0;
      color: #fff;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .input-bar .send-btn:hover { background: var(--brand-hover); }
    .input-bar .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ===== Tab 栏 ===== */
    .tabs-bar {
      grid-area: tabs;
      background: var(--panel);
      display: flex;
      align-items: stretch;
      /* iOS Home 条安全区域：防止内容被遮挡 */
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      flex: 1;
      background: transparent;
      border: 0;
      color: var(--tab-icon);
      font-size: 11px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px;
      padding: 5px 0 4px;
      cursor: pointer;
    }
    .tab.active { color: var(--tab-active); }
    .tab .ic { width: 24px; height: 24px; display: block; }
    .tab .ic img { width: 100%; height: 100%; object-fit: contain; }
    .tab .ic svg { width: 100%; height: 100%; }

    /* ===== 模态对话框 ===== */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
      z-index: 100;
    }
    .modal-mask.active { display: flex; }
    .modal {
      background: var(--panel);
      border-radius: 10px;
      padding: 24px 22px;
      width: 100%; max-width: 420px;
      display: grid; gap: 14px;
    }
    .modal h2 { margin: 0; font-size: 17px; color: var(--ink); font-weight: normal; }
    .modal label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
    .modal input, .modal textarea, .modal select {
      width: 100%;
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink-strong);
      padding: 9px 12px;
      outline: none;
      font-size: 14px;
    }
    .modal textarea { min-height: 72px; resize: vertical; }
    .modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal .btn-cancel, .modal .btn-confirm {
      height: 38px; padding: 0 16px;
      border: 0; border-radius: 6px;
      font-size: 14px; cursor: pointer;
    }
    .modal .btn-cancel { background: var(--panel-3); color: var(--ink); }
    .modal .btn-confirm { background: var(--brand); color: #fff; }
    .modal .btn-confirm:disabled { opacity: 0.55; cursor: not-allowed; }
    .modal .error-text { font-size: 13px; color: var(--bubble-error-ink); min-height: 18px; }
    .agent-list {
      display: grid;
      gap: 8px;
      max-height: min(50vh, 360px);
      overflow: auto;
    }
    .agent-option {
      width: 100%;
      min-height: 42px;
      background: var(--panel-3);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 6px;
      padding: 0 12px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }
    .agent-option:hover { background: #353535; }
    .agent-option.active {
      border-color: var(--brand);
      background: rgba(39, 117, 255, 0.16);
      color: var(--ink-strong);
    }
    .agent-option:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    /* ===== 登录页 ===== */
    .login {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: var(--bg);
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: var(--panel);
      border-radius: 10px;
      padding: 28px 24px;
      display: grid; gap: 14px;
    }
    .login-card .brand-row { display: flex; align-items: center; gap: 12px; }
    .login-card .brand-row .icon { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; }
    .login-card .brand-row .icon img { width: 100%; height: 100%; }
    .login-card .brand-row .name { font-size: 18px; color: var(--ink); }
    .login-card .brand-row .name small { display: block; font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
    .auth-tabs { display: flex; background: var(--panel-3); border-radius: 6px; padding: 3px; }
    .auth-tab {
      flex: 1; height: 36px;
      background: transparent;
      border: 0;
      color: var(--ink-soft);
      border-radius: 4px;
      cursor: pointer;
    }
    .auth-tab.active { background: var(--panel-2); color: var(--ink-strong); }
    .login-card label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
    .login-card input {
      width: 100%; height: 40px;
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink-strong);
      padding: 0 12px;
      outline: none;
    }
    .login-card input::placeholder { color: var(--ink-faint); }
    .login-card .submit {
      height: 42px;
      background: var(--brand);
      border: 0; color: #fff;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    .login-card .submit:disabled { opacity: 0.55; }
    .login-card .error {
      font-size: 14px;
      color: #ff6b6b;
      min-height: 0;
      padding: 0;
      background: transparent;
      border-radius: 6px;
      transition: padding 0.15s ease;
    }
    .login-card .error.show {
      padding: 10px 12px;
      background: rgba(255, 80, 80, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.4);
    }
    .login-card .hint { font-size: 12px; color: var(--ink-faint); text-align: center; }
  </style>
</head>
<body>

<!-- ============ 登录视图 ============ -->
<section id="loginView" class="login">
  <form id="loginForm" class="login-card">
    <div class="brand-row">
      <div class="icon"><img src="data:image/png;base64,__BRAND_PNG_B64__" alt="一龙" /></div>

<script>
(function () {
  'use strict';

  // ====== DOM 引用 ======
  const $ = (id) => document.getElementById(id);
  const loginView = $('loginView');
  const appView = $('appView');
  const loginForm = $('loginForm');
  const loginBtn = $('loginBtn');
  const loginError = $('loginError');
  const accountInput = $('accountInput');
  const nicknameInput = $('nicknameInput');
  const nicknameField = $('nicknameField');
  const passwordInput = $('passwordInput');
  const authModeButtons = document.querySelectorAll('[data-auth-mode]');

  const topTitle = $('topTitle');
  const backBtn = $('backBtn');
  const addBtn = $('addBtn');
  const searchBtn = $('searchBtn');

  const conversationList = $('conversationList');
  const chatView = $('chatView');
  const chatList = $('chatList');
  const stageHint = $('stageHint');
  const searchBar = $('searchBar');
  const searchInput = $('searchInput');

  const projectOverviewText = $('projectOverviewText');
  const currentStageText = $('currentStageText');
  const stagePlanText = $('stagePlanText');
  const stageCodeText = $('stageCodeText');
  const stageBuildText = $('stageBuildText');
  const stageDeliverText = $('stageDeliverText');
  const projectHistoryText = $('projectHistoryText');
  const projectContinueBtn = $('projectContinueBtn');
  const projectBuildBtn = $('projectBuildBtn');
  const projectRecordBtn = $('projectRecordBtn');
  const projectSettingsBtn = $('projectSettingsBtn');

  const profileAvatar = $('profileAvatar');
  const profileNickname = $('profileNickname');
  const profileAccount = $('profileAccount');
  const versionText = $('versionText');
  const deleteConfirmMask = $('deleteConfirmMask');
  const deleteConfirmText = $('deleteConfirmText');
  const deleteConfirmError = $('deleteConfirmError');
  const cancelDeleteBtn = $('cancelDeleteBtn');
  const confirmDeleteBtn = $('confirmDeleteBtn');
  const aiSettingsRow = $('aiSettingsRow');
  const usageContent = $('usageContent');
  const checkUpdateRow = $('checkUpdateRow');
  const updateArrow = $('updateArrow');
  const logoutRow = $('logoutRow');

  const inputBar = $('inputBar');
  const messageInput = $('messageInput');
  const sendBtn = $('sendBtn');
  const modelBtn = $('modelBtn');

  const tabs = document.querySelectorAll('.tab');
  const pages = document.querySelectorAll('.page');

  const newProjectMask = $('newProjectMask');
  const newProjectForm = $('newProjectForm');
  const projectNameInput = $('projectNameInput');
  const projectDescInput = $('projectDescInput');
  const templateSelect = $('templateSelect');
  const newProjectError = $('newProjectError');
  const createProjectBtn = $('createProjectBtn');
  const cancelNewProjectBtn = $('cancelNewProjectBtn');

  const agentMask = $('agentMask');
  const agentList = $('agentList');
  const agentError = $('agentError');
  const cancelAgentBtn = $('cancelAgentBtn');

  const progressLogMask = $('progressLogMask');
  const progressLogContent = $('progressLogContent');
  const closeProgressLogBtn = $('closeProgressLogBtn');

  const downloadApkBtn = $('downloadApkBtn');
  const copyLinkBtn = $('copyLinkBtn');
  const downloadLinkBox = $('downloadLinkBox');
  const downloadVersionText = $('downloadVersionText');

  // ====== 状态 ======
  const TOKEN_KEY = 'lodex_token';
  let token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem('elon_token') || '';
  let authMode = 'login';
  let currentUser = null;
  let projects = [];
  let currentProject = null;
  let currentTab = 'chatPage';
  let socket = null;
  let busy = false;
  let progressLog = [];
  let searchQuery = '';
  let selectedAgent = '';
  let agentOptions = [];
  let agentSelectionInitialized = false;
  let agentLoading = false;
  let codexCliOnly = false;

  // ====== 工具 ======
  function api(path, options = {}) {
    const headers = Object.assign({}, options.headers || {});
    if (token) headers.Authorization = 'Bearer ' + token;
    if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    return fetch(path, Object.assign({}, options, { headers }));
  }
  function escapeHtml(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function withToken(href) {
    try {
      const url = new URL(href, location.origin);
      if (url.pathname.indexOf('/api/projects/') !== -1 && !url.searchParams.has('token')) {
        url.searchParams.set('token', token);
      }
      return url.toString();
    } catch { return href; }
  }
  function setBusy(value) {
    busy = !!value;
    sendBtn.disabled = busy || !currentProject;
    if (!busy) stageHint.textContent = '点击输入需求，开发进度会自动记录到项目页。';
  }
  function formatTime(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
      }
      return (d.getMonth() + 1) + '/' + d.getDate();
    } catch { return ''; }
  }

  // ====== 登录/注册 ======
  function setAuthMode(mode) {
    authMode = mode === 'register' ? 'register' : 'login';
    const reg = authMode === 'register';
    authModeButtons.forEach((b) => b.classList.toggle('active', b.dataset.authMode === authMode));
    nicknameField.classList.toggle('hidden', !reg);
    passwordInput.autocomplete = reg ? 'new-password' : 'current-password';
    loginBtn.textContent = reg ? '创建账号' : '登录';
    loginError.textContent = '';
  }
  authModeButtons.forEach((b) => b.addEventListener('click', () => setAuthMode(b.dataset.authMode)));

  function setLoginError(msg) {
    loginError.textContent = msg || '';
    loginError.classList.toggle('show', !!msg);
  }
  function fetchWithTimeout(url, options, ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, Object.assign({}, options, { signal: ctrl.signal }))
      .finally(() => clearTimeout(t));
  }
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true;
    const origBtnText = loginBtn.textContent;
    loginBtn.textContent = authMode === 'register' ? '创建中…' : '登录中…';
    setLoginError('');
    try {
      const payload = {
        account: accountInput.value.trim(),
        password: passwordInput.value,
        device_name: 'web'
      };
      if (authMode === 'register') payload.nickname = nicknameInput.value.trim();
      const res = await fetchWithTimeout(authMode === 'register' ? '/api/auth/register' : '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }, 15000);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || (authMode === 'register' ? '注册失败' : '登录失败'));
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      localStorage.removeItem('elon_token');
      currentUser = data.user;
      await boot();
    } catch (err) {
      const msg = err && err.name === 'AbortError' ? '请求超时，请检查网络后重试' : (err && err.message) || '网络错误';
      setLoginError(msg);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = origBtnText;
    }
  });

  function showLogin() {
    if (socket) { try { socket.close(); } catch {} socket = null; }
    appView.classList.add('hidden');
    loginView.classList.remove('hidden');
  }
  function showApp() {
    loginView.classList.add('hidden');
    appView.classList.remove('hidden');
  }

  // ====== Tab 切换 ======
  function switchTab(tabId) {
    currentTab = tabId;
    tabs.forEach((t) => t.classList.toggle('active', t.dataset.tab === tabId));
    pages.forEach((p) => p.classList.toggle('active', p.id === tabId));
    const inChat = tabId === 'chatPage' && !!currentProject;
    // 顶栏标题：项目内保留项目名，列表态使用 tab 静态名
    const t = Array.prototype.find.call(tabs, (x) => x.dataset.tab === tabId);
    if (inChat) {
      topTitle.textContent = currentProject.name || '会话';
    } else {
      topTitle.textContent = t ? t.dataset.title : '';
    }
    // 兜底：chatPage 且没有项目 → 强制回到列表态，避免出现"气泡可见但输入栏消失"的半残 UI
    if (tabId === 'chatPage' && !currentProject) {
      chatView.classList.add('hidden');
      conversationList.classList.remove('hidden');
    }
    // 输入栏：仅"会话"页且已进入项目时显示
    inputBar.classList.toggle('active', inChat);
    // 返回按钮：仅"会话"页进入项目后显示
    backBtn.style.display = inChat ? '' : 'none';
    // 新建按钮：仅会话页显示
    addBtn.style.display = tabId === 'chatPage' ? '' : 'none';
    searchBtn.style.display = tabId === 'chatPage' ? '' : 'none';
    // 下载页：切入"我的"时刷新版本信息
    if (tabId === 'profilePage') {
      refreshDownloadPage();
      loadUsageStats().catch((e) => console.warn('loadUsageStats failed:', e));
    }
  }
  tabs.forEach((t) => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  backBtn.addEventListener('click', () => {
    // 退出当前项目，回到会话列表
    if (socket) { try { socket.close(); } catch {} socket = null; }
    currentProject = null;
    progressLog = [];
    chatView.classList.add('hidden');
    conversationList.classList.remove('hidden');
    inputBar.classList.remove('active');
    backBtn.style.display = 'none';
    resetProjectPage();
    renderConversationList();
  });

  // ====== 会话/项目列表 ======
  function renderConversationList() {
    const filtered = searchQuery
      ? projects.filter((p) => (p.name || '').toLowerCase().includes(searchQuery))
      : projects;
    if (!filtered.length) {
      conversationList.innerHTML = searchQuery
        ? '<div class="empty-tip">没有匹配的项目</div>'
        : '<div class="empty-tip">还没有项目<br/>点击右上角 ＋ 新建你的第一个 App'
          + '<br/><button id="emptyCreateBtn">新建项目</button></div>';
      if (!searchQuery) {
        const b = $('emptyCreateBtn');
        if (b) b.addEventListener('click', openNewProject);
      }
      return;
    }
    conversationList.innerHTML = '';
    filtered.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'conversation-item' + (currentProject && currentProject.id === p.id ? ' active' : '');
      item.style.cssText = 'cursor:pointer';
      const status = p.last_task_status || p.status || '准备就绪';
      item.innerHTML =
        '<span class="brand"><img src="data:image/png;base64,__BRAND_PNG_B64__" alt="" /></span>'
        + '<span class="text">'
        + '<span class="title"></span>'
        + '<span class="sub"></span>'
        + '</span>'
        + '<span class="time"></span>'
        + '<button class="item-delete" title="删除项目" type="button">'
        + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>'
        + '</button>';
      item.querySelector('.title').textContent = p.name || '未命名项目';
      item.querySelector('.sub').textContent = status;
      item.querySelector('.time').textContent = formatTime(p.updated_at);
      item.querySelector('.item-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        openDeleteConfirm(p);
      });
      item.addEventListener('click', () => selectProject(p));
      conversationList.appendChild(item);
    });
  }

  function selectProject(project) {
    searchBar.classList.add('hidden');
    searchQuery = '';
    searchInput.value = '';
    currentProject = project;
    progressLog = [];
    conversationList.classList.add('hidden');
    chatView.classList.remove('hidden');
    chatList.innerHTML = '';
    appendBubble('progress', '已进入项目「' + (project.name || '') + '」，可以开始描述需求。');
    inputBar.classList.add('active');
    backBtn.style.display = '';
    topTitle.textContent = project.name || '会话';
    renderProjectPage(project);
    connectSocket();
    setBusy(false);
  }

  // ====== 4阶段进度更新 ======
  const STAGE_ELS = () => [stagePlanText, stageCodeText, stageBuildText, stageDeliverText];
  const STAGE_NAMES = ['1. 需求分析', '2. 开发实现', '3. 编译打包', '4. 交付下载'];
  function updateStageLines(stepCurrent, allDone) {
    STAGE_ELS().forEach((el, i) => {
      el.className = 'stage-line';
      const step = i + 1;
      if (allDone || step < stepCurrent) {
        el.className = 'stage-line done';
        el.textContent = STAGE_NAMES[i] + '：✓ 完成';
      } else if (step === stepCurrent) {
        el.className = 'stage-line active';
        el.textContent = STAGE_NAMES[i] + '：进行中';
        if (!allDone) {
          currentStageText.textContent = STAGE_NAMES[i] + ' 进行中…';
          stageHint.textContent = STAGE_NAMES[i] + ' 进行中…';
        }
      } else {
        el.textContent = STAGE_NAMES[i] + '：等待';
      }
    });
  }

  // ====== WebSocket ======
  function connectSocket() {
    if (socket) { try { socket.close(); } catch {} socket = null; }
    if (!currentProject || !token) return;
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = scheme + '://' + location.host + '/ws/projects/' +
      encodeURIComponent(currentProject.id) + '?token=' + encodeURIComponent(token);
    try {
      socket = new WebSocket(url);
    } catch (e) {
      appendBubble('error', '连接失败：' + e.message);
      return;
    }
    socket.addEventListener('open', () => appendBubble('progress', '项目通道已连接。'));
    socket.addEventListener('close', () => setBusy(false));
    socket.addEventListener('error', () => appendBubble('error', '项目通道连接异常。'));
    socket.addEventListener('message', (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'progress') {
          const msg = data.message || '';
          progressLog.push(msg);
          appendBubble('progress', msg);
          if (data.step_current) updateStageLines(data.step_current, false);
        } else if (data.type === 'tool_call') appendBubble('progress', '工具：' + (data.tool || ''));
        else if (data.type === 'tool_result') appendBubble('progress', (data.tool || 'tool') + '\n' + (data.result || ''));
        else if (data.type === 'done') {
          setBusy(false);
          stageHint.textContent = '✓ 任务完成，可以继续描述新需求。';
          updateStageLines(4, true);
          currentStageText.textContent = '✓ 任务完成';
          if (progressLog.length) {
            projectHistoryText.textContent = progressLog
              .map((m, i) => '【步骤 ' + (i + 1) + '】\n' + m)
              .join('\n\n');
          }
          const links = [];
          if (data.apk_url) links.push({ href: data.apk_url, label: '下载 APK' });
          if (data.image_url) links.push({ href: data.image_url, label: '查看图片' });
          appendBubble('ai', data.message || '已完成。', links);
          loadProjects();
        } else if (data.type === 'error') {
          setBusy(false);
          appendBubble('error', data.message || 'unknown error');
          loadProjects();
        }
      } catch {
        appendBubble('error', '解析失败：' + ev.data);
      }
    });
  }

  function friendlyModelName(model) {
    const m = (model || '').trim();
    const key = m.toLowerCase();
    const names = {
      'gpt-4o': 'GPT-4o',
      'gpt-4o-mini': 'GPT-4o mini',
      'gpt-4.1': 'GPT-4.1',
      'gpt-4.5-preview': 'GPT-4.5 Preview',
      'claude-3.5-sonnet': 'Claude 3.5 Sonnet',
      'claude-3-5-sonnet-20241022': 'Claude 3.5 Sonnet',
      'claude-3.7-sonnet': 'Claude 3.7 Sonnet',
      'claude-3-7-sonnet-20250219': 'Claude 3.7 Sonnet',
      'claude-sonnet-4': 'Claude Sonnet 4',
      'claude-sonnet-4-5': 'Claude Sonnet 4',
      'o1-mini': 'o1 mini',
      'o1-preview': 'o1 preview',
      'o3-mini': 'o3 mini',
      'gemini-2.0-flash': 'Gemini 2.0 Flash',
      'gemini-2.0-flash-001': 'Gemini 2.0 Flash',
      'gemini-2.5-pro': 'Gemini 2.5 Pro',
      'gemini-2.5-pro-preview': 'Gemini 2.5 Pro'
    };
    return names[key] || m;
  }
  function cleanModelLabel(label) {
    let m = (label || '').trim().replace(/^copilot\s*\/\s*/i, '');
    const bracket = m.match(/\[([^\]]+)\]\s*$/);
    if (bracket && bracket[1].trim()) return friendlyModelName(bracket[1].trim());
    if (m.includes('/')) {
      const tail = m.split('/').pop().trim();
      if (tail) return friendlyModelName(tail);
    }
    return friendlyModelName(m);
  }
  function modelOptionLabel(item) {
    const model = (item.model || '').trim();
    if (model && !/^default$/i.test(model)) return friendlyModelName(model);
    return cleanModelLabel(item.label || item.name || 'unknown');
  }
  function shortModelLabel(label) {
    // 与 APK MainActivity.shortModelLabel 对齐
    const m = cleanModelLabel(label);
    if (/^Codex/i.test(m)) return 'Codex';
    if (m.startsWith('服务器默认') || m === '默认模型') return '默认';
    if (m.startsWith('自定义')) return '自定';
    if (m.startsWith('GPT')) return m.replace(/ /g, '').slice(0, 6);
    if (m.startsWith('gpt-')) return m.slice(0, 6);
    if (m.startsWith('o1') || m.startsWith('o3')) return m.replace(/ /g, '').slice(0, 5);
    if (m.startsWith('Claude')) return 'Cl' + (m.split(' ').pop() || '').slice(0, 3);
    if (m.startsWith('Gemini')) return 'G' + (m.split(' ').pop() || '').slice(0, 4);
    return m.slice(0, 6);
  }
  function selectedAgentOption() {
    return agentOptions.find((it) => (it.name || '') === selectedAgent) || agentOptions[0] || { name: '', label: '默认模型' };
  }
  function updateModelButton(label) {

  function renderAgentOptions() {

    const items = agentOptions.length ? agentOptions : [{ name: '', label: agentLoading ? '加载中...' : '默认模型', disabled: agentLoading }];
    items.forEach((item) => {

  async function persistAgentSelection(option) {
    const res = await api('/api/user/' + encodeURIComponent(currentUser.id) + '/agent', {
      method: 'PUT',
      body: JSON.stringify({
        use_agent: option.name || null,
        api_base: null,

  async function selectAgentOption(option) {
    if (!option || option.disabled || agentLoading || codexCliOnly) return;
    const previousAgent = selectedAgent;
    const previousLabel = selectedAgentOption().label;
    selectedAgent = option.name || '';
    updateModelButton(option.label);
    renderAgentOptions();
    agentError.textContent = '';
    agentLoading = true;
    renderAgentOptions();
    try {
      await persistAgentSelection(option);
      agentMask.classList.remove('active');
    } catch (err) {
      selectedAgent = previousAgent;
      updateModelButton(previousLabel);
      agentError.textContent = '模型切换失败：' + ((err && err.message) ? err.message : '请稍后重试');
    } finally {
      agentLoading = false;
      renderAgentOptions();
    }
  }
  async function loadAgents() {
    if (!currentUser) return;
    agentError.textContent = '';
    agentLoading = true;
    renderAgentOptions();
    try {
      const res = await api('/api/user/' + encodeURIComponent(currentUser.id) + '/agent');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      codexCliOnly = !!data.codex_cli_only;
      if (codexCliOnly) {
        selectedAgent = '';
        agentOptions = [{ name: '', label: 'Codex CLI', disabled: true }];
        updateModelButton('Codex CLI');
        return;
      }
      const options = [{ name: '', label: '默认模型' }].concat((data.available_agents || []).map((it) => ({
        name: it.name || '',
        label: modelOptionLabel(it)
      })).filter((it) => it.name));
      agentOptions = options;
      if (!agentSelectionInitialized) {
        const configured = data.config && data.config.use_agent;
        selectedAgent = options.some((it) => it.name === configured) ? configured : '';
        agentSelectionInitialized = true;
      }
      updateModelButton(selectedAgentOption().label);
    } catch (err) {
      codexCliOnly = false;
      agentOptions = [{ name: '', label: '默认模型' }];
      agentError.textContent = '模型列表加载失败：' + ((err && err.message) ? err.message : '请稍后重试');
    } finally {
      agentLoading = false;
      renderAgentOptions();
    }
  }

  // ====== Token 消耗统计 ======
  async function loadUsageStats() {
    if (!currentUser) return;
    usageContent.innerHTML = '<div class="usage-hint">加载中…</div>';
    try {
      const res = await api('/api/user/' + encodeURIComponent(currentUser.id) + '/usage/stats?days=30');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      const t = data.total || {};
      const total = t.total_tokens || 0;
      const input = t.input_tokens || 0;
      const output = t.output_tokens || 0;
      const cached = t.cached_input_tokens || 0;
      function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
      const rows = [
        ['总 tokens', fmt(total)],
        ['输入 tokens', fmt(input)],
        ['输出 tokens', fmt(output)],
        ['缓存命中', fmt(cached)],
      ];
      // 按功能分组（项目开发 / 运行时小数 top3）
      const byFeature = (data.by_feature || []).slice(0, 3);
      usageContent.innerHTML = rows.map(([l, v]) =>
        '<div class="usage-row"><span class="usage-label">' + l + '</span><span class="usage-value">' + v + '</span></div>'
      ).join('') +
      (byFeature.length ? '<div class="usage-hint" style="margin-top:10px;color:var(--ink-soft)">' +
        byFeature.map((f) => (f.feature || 'other') + ' ' + fmt(f.total_tokens)).join('、') +
        '</div>' : '') +
      (total === 0 ? '<div class="usage-hint">近 30 天暂无记录</div>' : '');
    } catch (err) {
      usageContent.innerHTML = '<div class="usage-hint" style="color:var(--bubble-error-ink)">加载失败</div>';
    }
  }

    if (!progressLog.length) {
      progressLogContent.textContent = '暂无进度记录。\n开始开发后，AI 每一步执行状态都会记录在这里。';
    } else {
      progressLogContent.textContent = progressLog
        .map((m, i) => '【步骤 ' + (i + 1) + '】\n' + m)
        .join('\n\n');
    }
    progressLogMask.classList.add('active');
  });
  closeProgressLogBtn.addEventListener('click', () => progressLogMask.classList.remove('active'));
  progressLogMask.addEventListener('click', (e) => { if (e.target === progressLogMask) progressLogMask.classList.remove('active'); });
  projectSettingsBtn.addEventListener('click', openAgentDialog);

  // ====== 启动 ======
  async function boot() {
    if (!token) { showLogin(); return; }
    try {
      await loadMe();
    } catch (err) {
      if (err && err.authFailed) {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem('elon_token');
        token = '';
      }
      setLoginError((err && err.message) ? err.message : '加载失败，请重试');
      showLogin();
      return;
    }
    showApp();
    switchTab('chatPage');
    // 后续数据加载失败不踢回登录页，仅在控制台告警
    Promise.all([
      loadProjects().catch((e) => console.warn('loadProjects failed:', e)),
      loadVersion().catch((e) => console.warn('loadVersion failed:', e)),
    ]).then(() => loadAgents()).catch((e) => console.warn('loadAgents failed:', e));
  }
  setAuthMode('login');
  boot();
})();

// ===== iOS PWA：键盘弹起时防止页面被压缩 =====
if (window.visualViewport) {
  const app = document.querySelector('#app');
  window.visualViewport.addEventListener('resize', () => {
    if (app) {
      app.style.height = window.visualViewport.height + 'px';
    }
  });
}

// ===== Service Worker 注册（离线缓存 / PWA 壳） =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((e) => {
      console.warn('SW registration failed:', e);
    });
  });
}
</script>
</body>
</html>
