def sortedInputs = inputFiles.toList().sort { left, right ->
    repoRoot.toPath().relativize(left.toPath()).toString().replace('\\', '/') <=>
        repoRoot.toPath().relativize(right.toPath()).toString().replace('\\', '/')
}

def normalizeFingerprintText = { String text ->
    text.replace("\r\n", "\n").replace("\r", "\n")
}

def fingerprintText = { String relativePath, String text ->
    def normalized = normalizeFingerprintText(text)
    if (relativePath.endsWith("ChatGptWebPageAdapter.kt")) {
        return normalized.replaceAll(
            /ADAPTER_VERSION\s*=\s*\d+/,
            "ADAPTER_VERSION = <normalized>",
        )
    }
    if (relativePath.startsWith("scripts/") && relativePath.endsWith(".ps1")) {
        return normalized.replaceAll(
            /ExpectedAdapterVersion\s*=\s*\d+/,
            "ExpectedAdapterVersion = <normalized>",
        )
    }
    normalized
}

def normalizedInputBytes = { File input ->
    normalizeFingerprintText(input.getText("UTF-8")).getBytes(StandardCharsets.UTF_8)
}

def fingerprintBytes = { File input ->
    def relativePath = repoRoot.toPath().relativize(input.toPath()).toString().replace('\\', '/')
    fingerprintText(relativePath, input.getText("UTF-8")).getBytes(StandardCharsets.UTF_8)
}

def digestFiles = { Collection<File> files ->
    def caseDigest = MessageDigest.getInstance("SHA-256")
    files.toList().sort { left, right ->
        repoRoot.toPath().relativize(left.toPath()).toString().replace('\\', '/') <=>
            repoRoot.toPath().relativize(right.toPath()).toString().replace('\\', '/')
    }.each { input ->
        def relativePath = repoRoot.toPath().relativize(input.toPath()).toString().replace('\\', '/')
        caseDigest.update(relativePath.getBytes(StandardCharsets.UTF_8))
        caseDigest.update((byte) 0)
        caseDigest.update(fingerprintBytes(input))
        caseDigest.update((byte) 0)
    }
    caseDigest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def filesMatching = { List<String> patterns ->
    def matches = new LinkedHashSet<File>()
    patterns.each { pattern ->
        fileTree(repoRoot).matching { include pattern }.files.each { matches.add(it) }
    }
    if (matches.isEmpty()) {
        throw new GradleException("ChatGPT Web verification fingerprint matched no files: ${patterns}")
    }
    matches
}

