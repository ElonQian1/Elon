<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一龙 · 币安广场发布</title><link rel="stylesheet" href="/assets/articles.css"><style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1b2330;--ink:#e9edf4;--muted:#b9c7db}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}button,input{font:inherit}form{display:flex;flex-direction:column;gap:18px}label{display:flex;flex-direction:column;gap:8px}input,button{padding:12px;border:1px solid #8491a655;border-radius:8px;background:var(--panel);color:inherit;min-height:48px}button{cursor:pointer}button:disabled{opacity:.5}.bar{display:flex;gap:12px;flex-wrap:wrap}.cards{display:grid;gap:16px;margin-top:24px}.card{text-align:left;display:grid;gap:8px}.card strong{font-size:19px}.card small{color:var(--muted)}[hidden]{display:none!important}#notice{color:var(--muted);overflow-wrap:anywhere}
</style><script defer src="/assets/article_square_media.js"></script><script defer src="/assets/article_square.js"></script><script defer src="/assets/article_square_page.js"></script></head><body><main>
<h1>币安广场发布</h1><p>使用一龙账号登录，选择自己的文章，预览后发布到币安广场。</p><p id="notice" role="status" aria-live="polite"></p>
<form id="login"><label>一龙账号<input id="account" autocomplete="username" required maxlength="120"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="512"></label><button type="submit">安全登录</button></form>
<section id="workspace" hidden><div class="bar"><button id="history">发布记录与账号</button><button id="refresh">刷新我的文章</button><button id="logout">退出</button></div><div id="articles" class="cards"></div></section>
</main></body></html>
