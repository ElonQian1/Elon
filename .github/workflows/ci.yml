name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-server:
    name: Rust Server
    runs-on: windows-latest
    env:
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Source Size Guard
        shell: pwsh
        run: scripts\check-source-size.ps1

      - name: Source Ownership Guard
        shell: pwsh
        run: scripts\check-source-ownership.ps1

      - name: PC Entrypoint Contract
        shell: pwsh
        run: scripts\check-pc-entrypoint-contract.ps1

      - name: Feature Parity Audit
        shell: pwsh
        run: scripts\check-feature-parity.ps1

      - name: Project Feature Registry Adoption
        shell: powershell
        run: scripts\test-project-feature-registry-adoption.ps1

      - name: Document Modularity Guard
        shell: pwsh
        run: scripts\check-document-modularity.ps1

      - name: Release Runbook Guard
        shell: pwsh
        run: scripts\check-release-runbook.ps1

      - name: PC Frontend Publish Guard
        shell: pwsh
        run: |
          scripts\test-pc-frontend-only-publish.ps1
          scripts\test-pc-static-publish.ps1

      - name: CI Quality Gates Guard
        shell: pwsh
        run: scripts\check-ci-quality-gates.ps1

      - name: APP UI Fast Lane Guard
        shell: powershell
        run: scripts\test-app-ui-fast-lane.ps1

      - name: Stitch Design Import Guard
        shell: powershell
        run: scripts\test-stitch-design-import-workflow.ps1

      - name: Realtime Runbook Guard
        shell: pwsh
        run: scripts\check-realtime-runbook.ps1

      - name: Realtime Ownership Guard
        shell: pwsh
        run: scripts\check-realtime-ownership.ps1

      - name: Realtime Diagnostics Snapshot Guard
        shell: pwsh
        run: scripts\check-realtime-diagnostics-snapshot.ps1

      - name: Server Build Prerequisites
        shell: pwsh
        run: scripts\check-build-prerequisites.ps1 -Scope Server

      - name: Cache Cargo Audit
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\bin\cargo-audit.exe
            ~\.cargo\advisory-db
          key: cargo-audit-windows-0.22.2-${{ runner.arch }}

      - name: Install Cargo Audit
        shell: pwsh
        run: scripts\install-cargo-audit.ps1 -Version 0.22.2

      - name: Save Cargo Audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\.cargo\bin\cargo-audit.exe
            ~\.cargo\advisory-db
          key: cargo-audit-windows-0.22.2-${{ runner.arch }}

      - name: Dependency Audit Report
        shell: pwsh
        run: scripts\check-dependency-audit.ps1 -Mode Strict -SkipNpm -RequireRustAudit -AllowStaleRustAdvisoryDb

      - name: Rust Warning Budget
        shell: pwsh
        run: scripts\check-rust-warning-budget.ps1 -MaxWarnings 0

      - name: ESK Platform Ledger Tests
        shell: pwsh
        run: scripts\validate-rust.ps1 -- test --manifest-path server\tests\esk-platform-harness\Cargo.toml

      - name: Cargo Test
        id: cargo-test
        shell: pwsh
        run: scripts\cargo-dev.ps1 test --manifest-path server\Cargo.toml

      - name: Upload Rust Validation Evidence
        if: failure() && steps.cargo-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-validation-evidence-${{ github.run_id }}
          path: ~\AppData\Local\Elon\rust-cache-v2\validation-v1\evidence
          if-no-files-found: error
          retention-days: 7

  sui-move:
    name: ESK Sui Move
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Enable Git Long Paths
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - name: Sui Toolchain Contract Guard
        run: node scripts/test-esk-sui-toolchain-ci.js

      - name: Cache Fixed Sui Toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}\yilong-sui\testnet-v1.79.0\windows-x86_64
          key: sui-toolchain-v2-testnet-v1.79.0-windows-x86_64-9d8442bad8fd516116a76ff52213cdfd43b98857c3f7fbbde124ed5e2041a558-9046fce263794cca6772c59aacd328706d42522dd7408c0dcb4a7f2613016afd

      - name: Install Fixed Sui Toolchain
        shell: pwsh
        run: |
          $installRoot = "${{ runner.tool_cache }}\yilong-sui"
          $frameworkArchivePath = Join-Path $installRoot "testnet-v1.79.0\windows-x86_64\framework-source.tar.gz"
          scripts\install-esk-sui-toolchain.ps1 -InstallRoot $installRoot -FrameworkArchivePath $frameworkArchivePath

      - name: Verify ESK Move Packages
        shell: pwsh
        run: |
          $suiPath = "${{ runner.tool_cache }}\yilong-sui\testnet-v1.79.0\windows-x86_64\sui.exe"
          $frameworkArchivePath = "${{ runner.tool_cache }}\yilong-sui\testnet-v1.79.0\windows-x86_64\framework-source.tar.gz"
          $evidence = "${{ runner.temp }}\esk-sui-move-evidence"
          $moveHome = Join-Path "${{ runner.temp }}" "esk-sui-move-home-$([guid]::NewGuid().ToString('N'))"
          scripts\validate-esk-sui-move.ps1 -SuiPath $suiPath -FrameworkArchivePath $frameworkArchivePath -EvidenceDirectory $evidence -MoveHome $moveHome

      - name: Upload Sui Validation Evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esk-sui-move-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\esk-sui-move-evidence\artifact-verification.log
            ${{ runner.temp }}\esk-sui-move-evidence\esk_currency-build.log
            ${{ runner.temp }}\esk-sui-move-evidence\esk_currency-test.log
            ${{ runner.temp }}\esk-sui-move-evidence\test-esk-sui-allocation-vesting.log
            ${{ runner.temp }}\esk-sui-move-evidence\test-esk-sui-genesis-foundation.log
            ${{ runner.temp }}\esk-sui-move-evidence\validation-status.log
            ${{ runner.temp }}\esk-sui-move-evidence\yilong_participation-build.log
            ${{ runner.temp }}\esk-sui-move-evidence\yilong_participation-test.log
          if-no-files-found: warn
          retention-days: 7

  pc-frontend:
    name: PC Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: pc-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Audit Report
        shell: pwsh
        run: ../scripts/check-dependency-audit.ps1 -Mode Strict -SkipRust

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle Budget
        run: npm run check:bundle-budget

      - name: Message Flow Tests
        run: npm run test:message-flow

      - name: Workspace Access Tests
        run: npm run test:workspace-access

      - name: Admin Realtime Smoke
        run: npm run test:admin-realtime

  android:
    name: Android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android Build Prerequisites
        shell: pwsh
        run: scripts\check-build-prerequisites.ps1 -Scope Android

      - name: Unit Tests and Debug APK
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest :app:assembleDebug
