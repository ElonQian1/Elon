[package]
name = "elon-chat-attachment-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
chrono = "0.4"
hex = "0.4"
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
uuid = { version = "1", features = ["v4"] }
