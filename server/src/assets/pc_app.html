<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111214" />
  <title>一龙 PC 工作台</title>
  <link rel="icon" href="data:image/png;base64,__BRAND_PNG_B64__" />
  <link rel="stylesheet" href="/assets/pc_app.css" />
  <link rel="stylesheet" href="/assets/pc_app_node.css" />
  <link rel="stylesheet" href="/assets/pc_app_doctor.css" />
  <link rel="stylesheet" href="/assets/pc_voice_project.css" />
</head>
<body>
  <main class="pc-shell" id="pcShell">
    <aside class="server-rail" aria-label="空间">
      <button class="rail-avatar active" id="friendsRail" type="button" data-label="好友" aria-label="好友">
        <span class="rail-icon friends-icon" aria-hidden="true"></span>
        <small id="friendBadge"></small>
      </button>
      <button class="rail-avatar doctor" id="doctorRail" type="button" data-label="电脑医生" aria-label="电脑医生">
        <span class="rail-icon doctor-icon" aria-hidden="true"></span>
      </button>
      <button class="rail-avatar node" id="nodeRail" type="button" data-label="PC 节点" aria-label="PC 节点">
        <span class="rail-icon node-icon" aria-hidden="true"></span>
        <small id="nodeBadge"></small>
      </button>
      <button class="rail-avatar voice-project" id="voiceRail" type="button" data-label="ai声音" aria-label="ai声音">
        <span class="rail-icon voice-project-icon" aria-hidden="true"></span>
      </button>
      <div class="rail-divider"></div>
      <div class="project-rail-list" id="projectRailList"></div>
      <button class="rail-avatar add" id="openWebBtn" type="button" data-label="打开移动网页版" aria-label="打开移动网页版">
        <span class="rail-icon plus-icon" aria-hidden="true"></span>
      </button>
    </aside>

    <aside class="channel-panel">
      <div class="workspace-title">
        <div>
          <strong id="workspaceName">好友</strong>
          <span id="workspaceMeta">加载中</span>
        </div>
        <button class="icon-button" id="refreshBtn" type="button" title="刷新">↻</button>
      </div>
      <div class="channel-search">
        <input id="sidebarSearch" placeholder="搜索好友、频道或项目" />
      </div>
      <div class="channel-list" id="channelList"></div>
      <div class="user-strip">
        <div class="user-dot" id="userDot">龙</div>
        <div class="user-info">
          <strong id="userName">未登录</strong>
          <span id="userMeta">请先登录网页版</span>
        </div>
        <div class="user-actions">
          <button class="icon-button" id="userSettingsBtn" type="button" title="设置">⚙</button>
          <button class="icon-button" id="logoutBtn" type="button" title="退出登录">⎋</button>
        </div>
      </div>
    </aside>

    <section class="chat-column">
      <header class="chat-topbar">
        <div class="chat-title">
          <span id="channelGlyph">#</span>
          <div>
            <strong id="channelTitle">好友</strong>
            <span id="channelSubtitle">从左侧选择好友、节点或项目频道</span>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="text-button" id="openLegacyWebBtn" type="button">网页版</button>
          <button class="text-button" id="openLocalNodeBtn" type="button">本机节点</button>
        </div>
      </header>

      <div class="message-list" id="messageList"></div>

      <form class="composer" id="composer">
        <button class="composer-tool" type="button" id="aiTaskBtn" title="在 AI 开发频道发起任务">AI</button>
        <textarea id="messageInput" rows="1" placeholder="选择一个频道后开始输入"></textarea>
        <button class="send-button" id="sendBtn" type="submit">发送</button>
      </form>
    </section>

    <aside class="member-panel">
      <div class="member-title" id="memberPanelTitle">成员</div>
      <div class="member-list" id="memberList"></div>
    </aside>
  </main>
  <div class="rail-tooltip" id="railTooltip" role="tooltip"></div>
  <div class="settings-backdrop" id="settingsBackdrop" hidden>
    <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="settings-header">
        <div>
          <strong id="settingsTitle">设置</strong>
          <span>本机项目绑定到当前 PC 节点</span>
        </div>
        <button class="icon-button" id="settingsCloseBtn" type="button" title="关闭">×</button>
      </header>
      <div class="settings-body">
        <div class="settings-section-title">注册本地项目</div>
        <label class="settings-field">
          <span>项目目录</span>
          <div class="input-action">
            <input id="settingsProjectPath" placeholder="选择一个本机项目文件夹" />
            <button class="text-button" id="chooseProjectFolderBtn" type="button">选择文件夹</button>
          </div>
        </label>
        <label class="settings-field">
          <span>项目名称</span>
          <input id="settingsProjectName" placeholder="选择目录后自动填写" />
        </label>
        <details class="settings-advanced">
          <summary>Git 和描述（自动读取，可修改）</summary>
          <label class="settings-field">
            <span>Git 远端 origin</span>
            <input id="settingsProjectRepo" placeholder="选择目录后自动读取" />
          </label>
          <label class="settings-field">
            <span>Git 当前分支</span>
            <input id="settingsProjectBranch" placeholder="选择目录后自动读取" />
          </label>
          <label class="settings-field">
            <span>描述</span>
            <textarea id="settingsProjectDesc" rows="2" placeholder="可选"></textarea>
          </label>
        </details>
        <div class="settings-project-meta" id="settingsProjectMeta">尚未选择项目目录</div>
        <div class="settings-actions">
          <button class="text-button" id="inspectProjectFolderBtn" type="button">读取目录信息</button>
          <button class="send-button" id="registerProjectBtn" type="button">注册到云端</button>
        </div>
        <div id="settingsProjectResult"></div>
      </div>
    </section>
  </div>

  <script src="/assets/pc_app_utils.js"></script>
  <script src="/assets/pc_app_markdown.js"></script>
  <script src="/assets/pc_app_node.js"></script>
  <script src="/assets/pc_app_doctor.js"></script>
  <script src="/assets/voice_tts_sdk.js"></script>
  <script src="/assets/pc_voice_project.js"></script>
  <script src="/assets/pc_app.js"></script>
</body>
</html>
