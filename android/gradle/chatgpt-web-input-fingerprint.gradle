if (sortedInputs.isEmpty()) {
    throw new GradleException("ChatGPT Web fingerprint input set is empty")
}

def digest = MessageDigest.getInstance("SHA-256")
sortedInputs.each { input ->
    def relativePath = repoRoot.toPath().relativize(input.toPath()).toString().replace('\\', '/')
    digest.update(relativePath.getBytes(StandardCharsets.UTF_8))
    digest.update((byte) 0)
    digest.update(normalizedInputBytes(input))
    digest.update((byte) 0)
}

