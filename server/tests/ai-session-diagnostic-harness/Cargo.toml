[package]
name = "elon-ai-session-diagnostic-tests"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[[test]]
name = "node_agent_win_codex_ai_session_diagnostic"
path = "../node_agent_win_codex_ai_session_diagnostic.rs"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }

[[test]]
name = "node_agent_win_group_ai"
path = "../node_agent_win_group_ai.rs"

[[test]]
name = "node_agent_win_runtime_release"
path = "../node_agent_win_runtime_release.rs"
