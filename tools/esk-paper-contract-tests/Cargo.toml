[package]
name = "esk-paper-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
hmac = "0.12"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
uuid = { version = "1", features = ["v4"] }

[workspace]
