<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片二维码菜单验收</title><div id="root"></div><button id="menu" type="button">打开图片菜单</button>
<img id="picture" alt="二维码测试图片">
<script type="module">
  import React from 'react'; import { createRoot } from 'react-dom/client';
  import ImageScanHost from './src/features/scan/ImageScanHost.tsx';
  import fixture from '../scripts/fixtures/social-source-qr.png';
  document.getElementById('picture').src = fixture;
  createRoot(document.getElementById('root')).render(React.createElement(ImageScanHost));
  document.getElementById('menu').onclick = () => document.getElementById('picture').dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: 100, clientY: 100 }));
</script></html>
