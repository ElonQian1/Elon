pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri('https://jitpack.io')
            content {
                includeGroup('com.github.Dimezis')
            }
        }
    }
}

rootProject.name = "ElonApp"
include ':app'
include ':chat-voice-kit'
include ':ui-runtime-view-debug'
include ':ui-runtime-compose-debug'
