tasks.register("verifyChatGptWebFingerprintPortability") {
    group = "verification"
    description = "Verifies ChatGPT Web fingerprints are stable across checkout line endings."
    doLast {
        sortedInputs.each { input ->
            def relativePath = repoRoot.toPath().relativize(input.toPath()).toString().replace('\\', '/')
            def lfText = normalizeFingerprintText(input.getText("UTF-8"))
            def variants = [
                lf: lfText,
                crlf: lfText.replace("\n", "\r\n"),
                cr: lfText.replace("\n", "\r"),
            ]
            def expectedInput = normalizeFingerprintText(variants.lf)
            def expectedCase = fingerprintText(relativePath, variants.lf)
            variants.each { lineEnding, variant ->
                if (normalizeFingerprintText(variant) != expectedInput) {
                    throw new GradleException(
                        "ChatGPT Web global fingerprint changes with ${lineEnding} line endings: ${relativePath}",
                    )
                }
                if (fingerprintText(relativePath, variant) != expectedCase) {
                    throw new GradleException(
                        "ChatGPT Web case fingerprint changes with ${lineEnding} line endings: ${relativePath}",
                    )
                }
            }
        }
        println "CHATGPT_WEB_FINGERPRINT_PORTABILITY=passed files=${sortedInputs.size()}"
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("verifyChatGptWebFingerprintPortability")
}

