[package]
name = "elon-server"
version = "0.3.69"
edition = "2021"

[build-dependencies]
tauri-winres = "0.3.6"

[[bin]]
name = "elon-server"
path = "src/main.rs"

[[bin]]
name = "elon-pc-node"
path = "src/node_agent_main.rs"

[[bin]]
name = "elon-node-installer"
path = "src/node_installer_main.rs"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 共享协议（homecli PC agent ↔ 本服务的反向 WSS 长连接）
homecli-proto = { path = "homecli-proto" }
elon-pc-dev-runtime = { path = "pc-dev-runtime" }

# Web 框架
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip", "set-header"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ignore = "0.4"
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# HTTP 客户端（调用 AI API）
# 使用 rustls 而非 native-tls，方便 musl 交叉编译（不依赖系统 OpenSSL）
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart", "blocking"], default-features = false }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 环境变量
dotenvy = "0.15"

# 错误处理
anyhow = "1"
thiserror = "1"

# 异步流
futures = "0.3"
tokio-stream = "0.1"
portable-pty = "0.9.0"

# UUID
uuid = { version = "1", features = ["v4"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# SQLite 数据保存
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
hmac = "0.12"
ring = "0.17"

# 微信支付 v3 —— RSA-SHA256 请求签名 & AES-256-GCM 回调解密
rsa = { version = "0.9", features = ["pem"] }
aes-gcm = "0.10"

# 实时语音管线（方案 B：连接 OpenAI Realtime Transcription WSS）
# rustls 与 reqwest 保持一致，避免 musl 交叉编译时需要 OpenSSL
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
] }
