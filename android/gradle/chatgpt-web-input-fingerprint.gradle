def repoRoot = rootProject.projectDir.parentFile
def inputFiles = new LinkedHashSet<File>()

def addTree = { String relativeRoot, List<String> includes, List<String> excludes = [] ->
    def root = new File(repoRoot, relativeRoot)
    fileTree(root).matching {
        includes.each { include it }
        excludes.each { exclude it }
    }.files.each { inputFiles.add(it) }
}

def addRequiredFile = { String relativePath ->
    def input = new File(repoRoot, relativePath)
    if (!input.isFile()) {
        throw new GradleException("ChatGPT Web fingerprint input is missing: ${relativePath}")
    }
    inputFiles.add(input)
}

