[package]
name = "elon-desktop"
version = "0.1.0"
edition = "2021"
description = "一龙桌面工作台原生窗口壳（原型）：把 /pc 装进原生窗口，替代双击图标弹浏览器标签页的现状"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "elon-desktop"
path = "src/main.rs"
