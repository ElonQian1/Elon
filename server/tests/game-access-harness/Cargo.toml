[package]
name = "elon-game-access-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2"
hex = "0.4"
ring = "0.17"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
